<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Online Exam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center">

  <!-- Fullscreen Warning -->
  <div
    id="fullscreen-warning"
    onclick="requestFullscreen()"
    class="hidden w-full bg-red-100 text-red-800 text-center py-2 font-semibold cursor-pointer">
    ⚠️ You exited fullscreen. Click here to return to fullscreen.
  </div>

  <!-- Main Container -->
  <div class="w-full max-w-3xl bg-white shadow-lg rounded-lg mt-8 p-6">

    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold text-gray-800">
        AZ-900 Certification Exam
      </h1>
    </div>

    <!-- Divider -->
    <hr class="mb-6" />

    <!-- Start Exam Section -->
    <div id="start-section" class="space-y-4">

      <div>
        <label class="block text-gray-700 font-medium mb-1">
          Full Name
        </label>
        <input
          id="name"
          type="text"
          placeholder="Enter your full name"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200" />
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1">
          Roll Number
        </label>
        <input
          id="roll"
          type="text"
          placeholder="Enter your roll number"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200" />
      </div>

      <button
        onclick="startExam()"
        class="w-full bg-purple-800 hover:bg-purple-900 text-white font-semibold py-2 rounded-md transition">
        Check Score
      </button>

    </div>

    <!-- Question Section -->
    <div id="question-section" class="hidden">

      <!-- Question Box -->
      <div
        id="question-box"
        class="text-gray-800 text-lg leading-relaxed mb-6">
        <!-- Question injected here -->
      </div>
    </div>

  </div>

  <!-- App Script -->
  <script>
    window.startExam = async function () {
        const name = document.getElementById("name").value.trim();
        const roll = document.getElementById("roll").value.trim();

        // Validate inputs
        if (!name || !roll) {
            alert("Enter name and roll number");
            return;
        }

        if (name.length < 2 || name.length > 100) {
            alert("Name must be between 2 and 100 characters");
            return;
        }

        if (!/^[a-zA-Z0-9\-]+$/.test(roll)) {
            alert("Roll number can only contain letters, numbers, and hyphens");
            return;
        }

        if (roll.length < 2 || roll.length > 50) {
            alert("Roll number must be between 2 and 50 characters");
            return;
        }

        document.getElementById("start-section").classList.add("hidden");
        document.getElementById("question-section").classList.remove("hidden");  

        const attemptId = `${EXAM_ID}_${roll}`;
        const attemptRef = doc(db, "attempts", attemptId);
        const snap = await getDoc(attemptRef);

        // ===============================
        // RESUME
        // ===============================
        if (snap.exists()) {
            const data = snap.data();

            if (data.status === "SUBMITTED") {
            if (data.score !== null) {
                document.getElementById("question-box").innerHTML =
                `<h2>Your Score: ${data.score}%</h2>`;
            } else {
                document.getElementById("question-box").innerHTML =
                `<h2>Exam submitted. Awaiting scoring.</h2>`;
            }
            return;
            }

            return;
        }
    }
  </script>

</body>
</html>
